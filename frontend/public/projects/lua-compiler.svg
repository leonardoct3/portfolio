<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>

  <!-- subtle grid -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.8">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600"/>
    <path d="M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900 M1200 0 V900 M1400 0 V900"/>
  </g>

  <!-- accent bar -->
  <rect x="110" y="170" width="90" height="10" rx="5" fill="url(#accent2)"/>

  <!-- title -->
  <text x="110" y="290" fill="#0f172a" font-size="96" font-weight="800">Lua Compiler</text>
  <text x="114" y="350" fill="#64748b" font-size="38" font-weight="500">A compiler for Lua, built from scratch in Python</text>

  <!-- pipeline -->
  <g font-size="34" font-weight="700">
    <g>
      <rect x="110" y="470" width="270" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="245" y="532" fill="#0f172a" text-anchor="middle">Lexer</text>
    </g>
    <g>
      <rect x="450" y="470" width="270" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="585" y="532" fill="#0f172a" text-anchor="middle">Parser</text>
    </g>
    <g>
      <rect x="790" y="470" width="270" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="925" y="532" fill="#0f172a" text-anchor="middle">AST</text>
    </g>
    <g>
      <rect x="1130" y="470" width="360" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="1310" y="532" fill="#0f172a" text-anchor="middle">Semantic</text>
    </g>
    <!-- arrows -->
    <g stroke="#ef4444" stroke-width="5" fill="none">
      <path d="M390 520 H440"/><path d="M730 520 H780"/><path d="M1070 520 H1120"/>
    </g>
    <g fill="#ef4444">
      <path d="M440 520 l-18 -9 v18 z"/><path d="M780 520 l-18 -9 v18 z"/><path d="M1120 520 l-18 -9 v18 z"/>
    </g>
  </g>

  <!-- outputs -->
  <g font-size="36" font-weight="600">
    <text x="110" y="700" fill="#64748b">Outputs</text>
    <g><rect x="320" y="660" width="280" height="64" rx="32" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/><text x="460" y="702" fill="#b91c1c" text-anchor="middle">Interpreter</text></g>
    <g><rect x="630" y="660" width="330" height="64" rx="32" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/><text x="795" y="702" fill="#b91c1c" text-anchor="middle">.asm codegen</text></g>
  </g>
</svg>
